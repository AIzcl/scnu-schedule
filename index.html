<script>
/* ================================================================
   常量配置（依据学院2026-2027(1)学期研究生课程安排表核对）
================================================================ */
const OWNER = "庄崇立";
const DAYS_CN  = ["周一","周二","周三","周四","周五","周六","周日"];
const CATEGORY_LIST  = ["公共必修课","学科基础课","方向必修课","选修课","其他"];
const EXAM_LIST      = ["考试","考查"];
const WEEK_TYPE_LIST = ["全部","单周","双周"];
const CATEGORY_COLORS = {
  "公共必修课": {bg:"#FFE699", fg:"#7F6000", solid:"#D6A400"},
  "学科基础课": {bg:"#C6E0B4", fg:"#375623", solid:"#6FA84F"},
  "方向必修课": {bg:"#BDD7EE", fg:"#1F4E79", solid:"#2E75B6"},
  "选修课":     {bg:"#F8CBAD", fg:"#833C00", solid:"#E07B39"},
  "其他":       {bg:"#D9D9D9", fg:"#3F3F3F", solid:"#8C8C8C"}
};
/* 官方节次作息（表末注明）。第12节官方未给出，按晚间节奏推测21:30-22:10 */
const SECTION_TIMES = {
1:"08:30-09:10", 2:"09:20-10:00", 3:"10:20-11:00", 4:"11:10-11:50",
  5:"14:00-14:40", 6:"14:50-15:30", 7:"15:40-16:20", 8:"16:30-17:10",
  9:"19:00-19:40", 10:"19:50-20:30", 11:"20:40-21:20", 12:"21:30-22:10"
};
const MAX_SECTION = 12, MAX_WEEK = 25;
const DEFAULT_START = "2026-09-07";
const LS_KEY = "scnu_course_db_zhuang_v3";   // v3：时间段支持自定义时间

/* ================================================================
   数据层
================================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }

/* 预置课程：庄崇立专属5门（已免修英语）。
   特殊时间说明：算法实验课按备注 17:50-20:30；人工智能按备注 18:30 开始 */
function presetCourses(){
  return [
    {id:uid(), name:"论文写作与学术规范", category:"公共必修课", credit:1, hours:16, students:153,
     weekStart:2, weekEnd:10, weekType:"全部", examType:"考查", teacher:"杜志斌等",
     note:"26级全体硕士生。",
     schedules:[{day:4,start:1,end:2,location:"教A309",tag:"",customStart:"",customEnd:""}]},

    {id:uid(), name:"算法设计与分析", category:"学科基础课", credit:3, hours:48, students:153,
     weekStart:2, weekEnd:8, weekType:"全部", examType:"考试", teacher:"梁军、汪红松、曲超",
     note:"26级全体硕士生。实验课按学院备注为 17:50-20:30（早于标准第9节19:00），理论课为标准下午5-8节。",
     schedules:[
       {day:3,start:9,end:12,location:"信息中心403A/B/C",tag:"实验课",customStart:"17:50",customEnd:"20:30"},
       {day:4,start:5,end:8,location:"教A309",tag:"理论课",customStart:"",customEnd:""}]},

    {id:uid(), name:"具身认知与机器智能", category:"方向必修课", credit:2, hours:32, students:88,
     weekStart:5, weekEnd:12, weekType:"全部", examType:"考查", teacher:"余松森、周娴玮",
     note:"方向必修课/选修课；人工智能专业全体硕士生。",
     schedules:[{day:1,start:1,end:4,location:"教A309",tag:"",customStart:"",customEnd:""}]},

    {id:uid(), name:"人工智能", category:"方向必修课", credit:2, hours:32, students:146,
     weekStart:11, weekEnd:18, weekType:"全部", examType:"考查",
     teacher:"范晨悠、费超群、田星、王超群",
     note:"人工智能专业全体硕士生。按学院备注 18:30 开始（早于标准第9节19:00）。",
     schedules:[{day:3,start:9,end:12,location:"教B111",tag:"",customStart:"18:30",customEnd:""}]},

    {id:uid(), name:"移动智能", category:"选修课", credit:2, hours:32, students:118,
     weekStart:11, weekEnd:18, weekType:"全部", examType:"考查", teacher:"杨欢",
     note:"你已在该课人工智能57人名单中。",
     schedules:[{day:1,start:5,end:8,location:"教A209",tag:"",customStart:"",customEnd:""}]}
  ];
}

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.courses)){
        d.settings = d.settings || {};
        if(!d.settings.semesterStart) d.settings.semesterStart = DEFAULT_START;
        return d;
      }
    }
  }catch(e){ console.warn("读取本地数据失败", e); }
  const d = {settings:{semesterStart:DEFAULT_START}, courses:presetCourses()};
  try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); }catch(e){}
  return d;
}
let DB = loadDB();
function saveDB(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ toast("保存失败：存储不可用"); }
}

/* ================================================================
   时间处理：自定义时间优先，否则用标准节次时间
================================================================ */
function pad2(n){ return String(n).padStart(2,"0"); }
function validTime(t){ return /^([01]?\d|2[0-3]):[0-5]\d$/.test(t||""); }
function timeToMin(t){ const p=t.split(":"); return (+p[0])*60+(+p[1]); }

/* 某时间段的实际开始/结束（"HH:MM" 字符串） */
function slotStartStr(s){
  if(validTime(s.customStart)) return s.customStart;
  return (SECTION_TIMES[s.start]||"").split("-")[0] || "";
}
function slotEndStr(s){
  if(validTime(s.customEnd)) return s.customEnd;
  return (SECTION_TIMES[s.end]||"").split("-")[1] || "";
}
function slotStartMin(s){ return timeToMin(slotStartStr(s)); }
function slotEndMin(s){ return timeToMin(slotEndStr(s)); }
function slotTimeRange(s){ return slotStartStr(s)+" - "+slotEndStr(s); }
function hasCustomTime(s){ return validTime(s.customStart) || validTime(s.customEnd); }

/* ================================================================
   日期与周次
================================================================ */
function todayLocal(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function parseDateStr(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtMD(d){ return (d.getMonth()+1)+"/"+d.getDate(); }
function fmtYMD(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function dayIdx(d){ return (d.getDay()+6)%7; }
function semesterStartDate(){ return parseDateStr(DB.settings.semesterStart || DEFAULT_START); }
function realCurrentWeek(){
  const diff = todayLocal().getTime() - semesterStartDate().getTime();
  if(diff < 0) return 0;
  return Math.floor(diff/(7*86400000)) + 1;
}
function weekMonday(w){ return addDays(semesterStartDate(), (w-1)*7); }
function nowMinutes(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }

/* ================================================================
   课程工具
================================================================ */
function courseActiveInWeek(c,w){
  if(w < (c.weekStart||1) || w > (c.weekEnd||1)) return false;
  if(c.weekType==="单周" && w%2===0) return false;
  if(c.weekType==="双周" && w%2===1) return false;
  return true;
}
function scheduleBrief(c){
  if(!c.schedules || !c.schedules.length) return "—";
  return c.schedules.map(s=>{
    let t = DAYS_CN[s.day-1]+" "+s.start+"-"+s.end+"节";
    if(hasCustomTime(s)) t += "("+slotTimeRange(s)+")";
    if(s.location) t += "@"+s.location;
    if(s.tag) t += "("+s.tag+")";
    return t;
  }).join("；");
}
function weeksBrief(c){
  let t = c.weekStart+"-"+c.weekEnd+"周";
  if(c.weekType && c.weekType!=="全部") t += "("+c.weekType+")";
  return t;
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,
    ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function findConflicts(cand){
  const res=[];
  DB.courses.forEach(c=>{
    if(c.id===cand.id) return;
    if(c.weekEnd<cand.weekStart || cand.weekEnd<c.weekStart) return;
    (c.schedules||[]).forEach(a=>{ (cand.schedules||[]).forEach(b=>{
      if(a.day===b.day && !(a.end<b.start || b.end<a.start))
        res.push(c.name+"（"+DAYS_CN[a.day-1]+" "+a.start+"-"+a.end+"节）");
    });});
  });
  return res;
}
function findNextClass(){
  const real=realCurrentWeek(); if(real<1) return null;
  const todayD=dayIdx(todayLocal())+1, nowM=nowMinutes();
  for(let w=real; w<=Math.min(real+4,MAX_WEEK); w++){
    for(let d=(w===real?todayD:1); d<=7; d++){
      let best=null;
      DB.courses.forEach(c=>{
        if(!courseActiveInWeek(c,w)) return;
        (c.schedules||[]).forEach(s=>{
          if(s.day!==d) return;
          if(w===real && d===todayD && slotEndMin(s)<=nowM) return;
          if(!best || slotStartMin(s)<slotStartMin(best.s)) best={c,s};
        });
      });
      if(best) return {week:w, day:d, c:best.c, s:best.s};
    }
  }
  return null;
}

function renderGrid(){
  const grid=document.getElementById("weekGrid");
  grid.innerHTML="";
  const monday=weekMonday(viewWeek), sunday=addDays(monday,6), real=realCurrentWeek();
  document.getElementById("weekLabel").innerHTML =
    '第 '+viewWeek+' 周 '+(real>=1&&viewWeek===real?'<span class="now-badge">本周</span>':'')+
    '<small>'+fmtMD(monday)+' ~ '+fmtMD(sunday)+'</small>';

  const today=todayLocal(), nowM=nowMinutes();
  const isCurWeek = (viewWeek===real);

  const corner=document.createElement("div");
  corner.className="corner"; corner.textContent="节次";
  corner.style.gridRow="1"; corner.style.gridColumn="1";
  grid.appendChild(corner);

  for(let d=1; d<=7; d++){
    const date=addDays(monday,d-1);
    const isToday = date.getTime()===today.getTime();
    const el=document.createElement("div");
    el.className="grid-head"+(isToday?" today":"");
    el.innerHTML=DAYS_CN[d-1]+"<small>"+fmtMD(date)+(isToday?" ★":"")+"</small>";
    el.style.gridRow="1"; el.style.gridColumn=String(d+1);
    grid.appendChild(el);
  }
  for(let s=1; s<=MAX_SECTION; s++){
    const el=document.createElement("div");
    const sM=timeToMin(SECTION_TIMES[s].split("-")[0]);
    const eM=timeToMin(SECTION_TIMES[s].split("-")[1]);
    const isNow = isCurWeek && nowM>=sM && nowM<=eM;
    el.className="sec-cell"+(isNow?" now":"");
    el.innerHTML=s+(isNow?"●":"")+"<small>"+SECTION_TIMES[s].split("-")[0]+"</small>";
    el.style.gridRow=String(s+1); el.style.gridColumn="1";
    grid.appendChild(el);
  }
  const occ={}, blocks=[];
  DB.courses.forEach(c=>{
    if(!courseActiveInWeek(c,viewWeek)) return;
    (c.schedules||[]).forEach(s=>{
      blocks.push({c,s});
      for(let i=s.start;i<=s.end;i++) occ[i+"-"+s.day]=true;
    });
  });
  for(let s=1;s<=MAX_SECTION;s++) for(let d=1;d<=7;d++){
    if(occ[s+"-"+d]) continue;
    const el=document.createElement("div");
    el.className="grid-cell";
    el.style.gridRow=String(s+1); el.style.gridColumn=String(d+1);
    grid.appendChild(el);
  }
  blocks.forEach(({c,s})=>{
    const col=CATEGORY_COLORS[c.category]||CATEGORY_COLORS["其他"];
    const el=document.createElement("div");
    el.className="course-block";
    el.style.gridRow=(s.start+1)+" / span "+(s.end-s.start+1);
    el.style.gridColumn=String(s.day+1);
    el.style.background=col.bg; el.style.color=col.fg;
    el.style.borderLeft="3px solid "+col.solid;
    let inner="<b>"+esc(c.name)+(s.tag?"<br>"+esc(s.tag):"")+"</b>";
    if(hasCustomTime(s)) inner+='<span class="ctime">'+slotTimeRange(s)+'</span>';
    if(s.location) inner+="<span>"+esc(s.location)+"</span>";
    el.innerHTML=inner;
    el.onclick=()=>showDetail(c.id);
    grid.appendChild(el);
  });
}

           '<button class="btn small danger" onclick="delTempSchedule('+i+')">✕</button></div>';

function addTempSchedule(){
  const day=Number(document.getElementById("f_day").value);
  const ss=Number(document.getElementById("f_ss").value);
  const se=Number(document.getElementById("f_se").value);
  if(ss>se){ toast("开始节次不能大于结束节次"); return; }
  const cs=document.getElementById("f_cs").value;
  const ce=document.getElementById("f_ce").value;
  if(cs && ce && timeToMin(cs)>=timeToMin(ce)){ toast("自定义开始时间必须早于结束时间"); return; }
  tempSchedules.push({day:day,start:ss,end:se,
    location:document.getElementById("f_loc").value.trim(),
    tag:document.getElementById("f_tag").value.trim(),
    customStart:cs||"", customEnd:ce||""});
  document.getElementById("f_loc").value="";
  document.getElementById("f_tag").value="";
  document.getElementById("f_cs").value="";
  document.getElementById("f_ce").value="";
  renderTempSchedules();
}
function delTempSchedule(i){ tempSchedules.splice(i,1); renderTempSchedules(); }

function saveCourse(){
  const name=document.getElementById("f_name").value.trim();
  if(!name){ toast("课程名称不能为空"); return; }
  const credit=parseFloat(document.getElementById("f_credit").value);
  const hours=parseInt(document.getElementById("f_hours").value,10);
  const ws=parseInt(document.getElementById("f_ws").value,10);
  const we=parseInt(document.getElementById("f_we").value,10);
  if(isNaN(credit)||credit<0){ toast("学分必须为非负数字"); return; }
  if(isNaN(hours)||hours<0){ toast("学时必须为非负整数"); return; }
  if(isNaN(ws)||isNaN(we)||ws<1||we>MAX_WEEK||ws>we){ toast("周次范围不正确（1-"+MAX_WEEK+"，起始≤结束）"); return; }
  const course={
    id: editingId||uid(), name:name,
    category:document.getElementById("f_category").value,
    examType:document.getElementById("f_exam").value,
    credit:credit, hours:hours, weekStart:ws, weekEnd:we,
    weekType:document.getElementById("f_wt").value,
    teacher:document.getElementById("f_teacher").value.trim(),
    note:document.getElementById("f_note").value.trim(),
    schedules:tempSchedules,
    students: editingId ? (DB.courses.find(x=>x.id===editingId)||{}).students : undefined
  };
  if(editingId){
    const idx=DB.courses.findIndex(x=>x.id===editingId);
    if(idx>=0) DB.courses[idx]=course;
  } else DB.courses.push(course);
  saveDB(); renderAll();
  const conflicts=findConflicts(course);
  if(conflicts.length)
    showInfo("⚠️ 时间冲突提醒","已保存，但与以下课程时间重叠：<br><br>"+conflicts.map(esc).join("<br>"));
  else closeModal();
  toast("已保存："+name);
}

function deleteCourse(id){
  const c=DB.courses.find(x=>x.id===id); if(!c) return;
  confirmDialog("确认删除","确定删除课程《"+esc(c.name)+"》吗？<br>此操作不可恢复。",()=>{
    DB.courses=DB.courses.filter(x=>x.id!==id);
    saveDB(); renderAll(); toast("已删除："+c.name);
  });
}

function showToday(){
  const t=todayLocal(), real=realCurrentWeek(), nowM=nowMinutes();
  let html="<p>今天 "+fmtMD(t)+" "+DAYS_CN[dayIdx(t)]+"</p>";
  if(real<1){ html+="<p>假期中，尚未开学～</p>"; }
  else{
    html+="<p>当前为第 "+real+" 教学周</p><hr>";
    const list=[];
    DB.courses.forEach(c=>{
      if(!courseActiveInWeek(c,real)) return;
      (c.schedules||[]).forEach(s=>{ if(s.day===dayIdx(t)+1) list.push({c,s}); });
    });
    if(!list.length) html+="<p>今天没有课，好好休息！</p>";
    else{
      list.sort((a,b)=>slotStartMin(a.s)-slotStartMin(b.s));
      html+=list.map(({c,s})=>{
        const col=CATEGORY_COLORS[c.category]||CATEGORY_COLORS["其他"];
        const sM=slotStartMin(s), eM=slotEndMin(s);
        let st;
        if(nowM>=sM && nowM<=eM) st='<span class="st-doing">▶ 进行中</span>';
        else if(nowM<sM) st='<span class="st-next">⏳ '+(sM-nowM)+'分钟后开始</span>';
        else st='<span class="st-done">✔ 已结束</span>';
        return '<div class="today-item" style="border-left:4px solid '+col.solid+'">'+
          "<b>"+esc(c.name)+"</b>"+(s.tag?" ["+esc(s.tag)+"]":"")+"　"+st+"<br>"+
          "第"+s.start+"-"+s.end+"节（<b>"+slotTimeRange(s)+"</b>）<br>"+
          "📍 "+esc(s.location||"地点待定")+"　👤 "+esc(c.teacher||"—")+"</div>";
      }).join("");
    }
  }
  showInfo("☀️ 今日课程", html);
}

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast("已复制到剪贴板")).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); toast("已复制到剪贴板"); }catch(e){}
  ta.remove();
}

function exportWeekText(){
  const monday=weekMonday(viewWeek), sunday=addDays(monday,6);
  let lines=["【"+OWNER+" · 第"+viewWeek+"周课表】"+fmtYMD(monday)+" ~ "+fmtYMD(sunday),""];
  let has=false;
  for(let d=1; d<=7; d++){
    const arr=[];
    DB.courses.forEach(c=>{
      if(!courseActiveInWeek(c,viewWeek)) return;
      (c.schedules||[]).forEach(s=>{ if(s.day===d) arr.push({c,s}); });
    });
    if(arr.length){
      has=true;
      const dd=addDays(monday,d-1);
      lines.push(DAYS_CN[d-1]+"（"+fmtMD(dd)+"）");
      arr.sort((a,b)=>slotStartMin(a.s)-slotStartMin(b.s));
      arr.forEach(({c,s})=>{
        let t="  "+s.start+"-"+s.end+"节("+slotTimeRange(s)+") "+c.name;
        if(s.location) t+=" @"+s.location;
        if(s.tag) t+="("+s.tag+")";
        lines.push(t);
      });
      lines.push("");
    }
  }
  if(!has) lines.push("本周无课～");
  const text=lines.join("\n");
  copyText(text);
  showInfo("📤 导出本周课表","<p>已复制到剪贴板，可直接粘贴发送：</p>"+
           '<pre class="week-text">'+esc(text)+"</pre>");
}

function setSemester(){
  openModal('<h3 class="m-title">🗓 设置学期起始日</h3>'+
    '<div class="m-body"><p>请选择本学期<b>第一周周一</b>的日期：</p>'+
    '<input id="f_sem" type="date" value="'+DB.settings.semesterStart+
    '" style="font-size:16px;padding:10px;width:100%;margin-top:8px;border:1px solid #d5dce4;border-radius:8px;">'+
    '<p class="muted" style="margin-top:8px;">默认 2026-09-14（周一），修改后周次自动重新计算。</p></div>'+
    '<div class="m-btns"><button class="btn" onclick="closeModal()">取消</button>'+
    '<button class="btn primary" onclick="saveSemester()">保存</button></div>');
}
function saveSemester(){
  const v=document.getElementById("f_sem").value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ toast("日期格式不正确"); return; }
  const doSave=()=>{
    closeModal();
    DB.settings.semesterStart=v; saveDB();
    const r=realCurrentWeek(); viewWeek=r>=1?r:1;
    renderAll(); toast("学期起始日已更新");
  };
  if(parseDateStr(v).getDay()!==1){ confirmDialog("提醒","该日期不是周一，仍要保存吗？",doSave); return; }
  doSave();
}

function downloadFile(name, content, mime){
  try{
    const blob=new Blob([content],{type:mime||"application/octet-stream"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast("已导出备份文件");
  }catch(e){
    showInfo("导出数据","<p>当前浏览器不支持直接下载，请长按复制以下内容保存：</p>"+
             '<textarea style="width:100%" rows="8">'+esc(content)+"</textarea>");
  }
}

/* ================================================================

================================================================ */
document.querySelectorAll("#tabbar .tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll("#tabbar .tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("page-"+tab.dataset.page).classList.add("active");
    document.getElementById("fabAdd").style.display =
      tab.dataset.page==="courses" ? "block" : "none";
    if(tab.dataset.page==="schedule") renderNextBanner();
  });
});
document.getElementById("prevWeek").onclick=()=>{ if(viewWeek>1){ viewWeek--; renderAll(); } };
document.getElementById("nextWeek").onclick=()=>{ if(viewWeek<MAX_WEEK){ viewWeek++; renderAll(); } };
document.getElementById("btnThisWeek").onclick=()=>{ const r=realCurrentWeek(); viewWeek=r>=1?r:1; renderAll(); };
document.getElementById("searchInput").addEventListener("input", renderList);
document.getElementById("fabAdd").onclick=()=>openCourseForm(null);
document.querySelectorAll(".tool-item").forEach(el=>{
  el.addEventListener("click",()=>{
    const k=el.dataset.tool;
    if(k==="today") showToday();
    else if(k==="stats") showStats();
    else if(k==="exportText") exportWeekText();
    else if(k==="semester") setSemester();
    else if(k==="exportData") exportData();
    else if(k==="importData") importData();
    else if(k==="install") showInstall();
    else if(k==="about") showAbout();
  });
});
document.getElementById("fileInput").addEventListener("change", function(){
  const f=this.files[0]; this.value="";
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d || !Array.isArray(d.courses)) throw new Error("bad");
      d.settings=d.settings||{};
      if(!d.settings.semesterStart) d.settings.semesterStart=DEFAULT_START;
      d.courses.forEach(c=>{
        c.id=String(c.id||"").replace(/[^a-zA-Z0-9]/g,"")||uid();
        c.schedules=Array.isArray(c.schedules)?c.schedules:[];
        c.weekStart=Number(c.weekStart)||1; c.weekEnd=Number(c.weekEnd)||16;
        c.credit=Number(c.credit)||0; c.hours=Number(c.hours)||0;
        ["name","category","examType","weekType","teacher","note"].forEach(k=>{ c[k]=String(c[k]||""); });
        c.schedules.forEach(s=>{ s.customStart=s.customStart||""; s.customEnd=s.customEnd||""; });
      });
      confirmDialog("确认导入","将<b>覆盖</b>当前全部课程数据（"+d.courses.length+" 门），是否继续？",()=>{
        DB=d; saveDB(); renderAll(); toast("导入成功");
      });
    }catch(e){ toast("导入失败：文件格式不正确"); }
  };
  r.readAsText(f);
});

// 左右滑动切换周
let touchX=null;
const gw=document.getElementById("gridWrap");
gw.addEventListener("touchstart",e=>{ touchX=e.touches[0].clientX; },{passive:true});
gw.addEventListener("touchend",e=>{
  if(touchX===null) return;
  const dx=e.changedTouches[0].clientX-touchX;
  if(dx>60 && viewWeek>1){ viewWeek--; renderAll(); }
  else if(dx<-60 && viewWeek<MAX_WEEK){ viewWeek++; renderAll(); }
  touchX=null;
},{passive:true});
